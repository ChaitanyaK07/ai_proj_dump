[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder"
version = "0.1.0"
description = "Routes That Fit You: a personalised multi-objective walking route planner with learned search heuristics (CS F407)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Team Wayfinder" }]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pandas>=2.0,<3",
    "networkx>=3.0,<4",
    "torch>=2.0,<3",
    "matplotlib>=3.7,<4",
    "pyyaml>=6.0,<7",
    "fastapi>=0.110,<1",
    "pydantic>=2.0,<3",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
acquisition = ["osmnx>=2.0,<3", "rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0", "requests>=2.31"]

[project.scripts]
wayfinder = "wayfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs the full Jubilee Hills graph in data/processed (run `python -m wayfinder preprocess` first)"]
# third-party notice from starlette's TestClient, not from this project
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
